<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskFlow</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">TaskFlow</div>
        <div class="nav-user">
            <span id="user-name">Loading...</span>
            <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <div class="stat-title">Total Projects</div>
                <div class="stat-value" id="stat-projects">-</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-title">My Tasks (TODO)</div>
                <div class="stat-value" id="stat-todo">-</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-title">My Tasks (IN PROGRESS)</div>
                <div class="stat-value" id="stat-inprogress">-</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-title">Overdue Tasks</div>
                <div class="stat-value stat-danger" id="stat-overdue">-</div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            
            <!-- Projects List -->
            <div>
                <div class="list-header">
                    <h2>My Projects</h2>
                    <button id="btn-new-project" class="btn btn-primary">+ New Project</button>
                </div>
                <div class="item-list" id="projects-list">
                    <p class="text-muted">Loading projects...</p>
                </div>
            </div>

            <!-- Overdue Tasks -->
            <div>
                <div class="list-header">
                    <h2>Overdue Tasks</h2>
                </div>
                <div class="item-list" id="overdue-list">
                    <p class="text-muted">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="modal-overlay" id="project-modal">
        <div class="modal glass-panel">
            <div class="modal-header">
                <h2>Create New Project</h2>
                <button class="modal-close" onclick="closeModal('project-modal')">&times;</button>
            </div>
            <form id="create-project-form">
                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="project-desc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Project</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
